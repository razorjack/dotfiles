# Stereo sink for apps that cannot open the 20-channel aux-only Fireface "Direct" sink
# (e.g. Unity/FMOD games under Proton). Feeds Fireface AUX0/AUX1.
context.modules = [
  { name = libpipewire-module-loopback
    args = {
      node.description = "Fireface UCX II Stereo"
      capture.props = {
        node.name        = "fireface_stereo"
        media.class      = "Audio/Sink"
        audio.position   = [ FL FR ]
        # Above the Direct sink (1100), so a fresh install picks this sink as the default
        priority.session = 1200
      }
      playback.props = {
        node.name           = "output.fireface_stereo"
        audio.position      = [ AUX0 AUX1 ]
        target.object       = "alsa_output.usb-RME_Fireface_UCX_II__24079540__EAAF7769F24FCC8-00.Direct__Direct__sink"
        stream.dont-remix   = true
        node.dont-reconnect = true
        node.passive        = true
      }
    }
  }
]
